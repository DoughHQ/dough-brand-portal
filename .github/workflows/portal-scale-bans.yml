name: Portal scale bans

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/portal-scale-bans.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'vitest.config.*'
      - 'docs/portal-shell.md'
  push:
    branches: [main, master]

jobs:
  import-bans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Ban scripts use ripgrep; Ubuntu runners do not ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run check:home-ban
      - run: npm run check:reports-ban
      - run: npm run check:products-ban
      - run: npm run check:corrections-ban
      - run: npm run check:admin-ops-ban
      - run: npm run check:studies-ban
      - run: npm run check:claim-array-ban
      - run: npm run check:landmine-callers-ban
      - run: npm run check:admin-action-auth-ban
      - run: npm run check:service-role-callers-ban
      - run: npm run check:page-root-containment-ban
      - run: npm run check:dark-mode-ban
      - run: npm run check:transparency-ban
      - run: npm run check:distribution-ban
      - run: npm run check:audience-ban
      - run: npm run check:report-decks-ban
      - run: npm run check:study-setup-ban
      - run: npm run check:journey-ban
      - run: npm run check:box-method-ban
      - run: npm run check:box-client-ban
      - run: npm run check:concept-client-ban
      - run: npm run check:concept-cards-ban
      - run: npm run check:own-product-ban
