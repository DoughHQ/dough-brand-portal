      - run: npm run check:arm-image-ban
      - run: npm run check:study-lifecycle-ban
      - run: npm run check:concept-field-ban
      - run: npm run check:box-product-search-ban
      - run: npm run check:box-setup-ban
      - run: npm run check:box-allergen-ban
      - run: npm run check:box-prototype-pick-ban
      - run: npm run check:box-upc-ban
      - run: npm run check:study-masthead-ban
